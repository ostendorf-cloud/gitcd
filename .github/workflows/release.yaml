name: release

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled, unlabeled]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # The label list is release-me.yaml's defaults, spelled out: the condition
    # cannot read the configuration.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release-me/') &&
      contains(
        fromJSON('["release: pending", "release: tagged", "release: alpha", "release: beta", "release: rc"]'),
        github.event.label.name
      ))
    steps:
      - name: Mint a release app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ vars.GH_APP_RELEASE_APP_ID }}
          private-key: ${{ secrets.GH_APP_RELEASE_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          # A label event checks out the base branch, never the merge ref.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.sha }}
          fetch-depth: 0

      # release-me.yaml sets github-release-draft-until-assets-attach: true,
      # so this repository's own release is a draft, and publishing it is
      # on this same job: a draft fires no "release" webhook at all, so a
      # second, webhook-triggered workflow would never run. See
      # .goreleaser.yaml and release-me's own
      # docs/adr/0001-draft-releases-until-assets-attach.md, the
      # organisation's precedent for this shape.
      - name: Tag and draft a release for every merged release pull request
        id: release-me
        uses: ostendorf-cloud/release-me/action@e3346c4a5aa463642e8d0627b01b3308dc49e2ec  # v0.5.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785  # v5.2.8
        if: steps.release-me.outputs.tags != ''

      - name: Build, attach and publish the assets for every tag just released
        if: steps.release-me.outputs.tags != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          TAGS: ${{ steps.release-me.outputs.tags }}
        run: ./scripts/publish-release-assets.sh
