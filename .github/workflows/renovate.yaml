name: renovate

# Thin, per-repository trigger for this repository's own Renovate run. The shared reusable
# workflow runs self-hosted Renovate with a token scoped to this repository. The "edited"
# triggers let a ticked rebase checkbox on the Dependency Dashboard or on a Renovate pull
# request react within one run instead of waiting for the next schedule tick. The anti-loop
# condition lives inside the reusable workflow, so this caller needs none.
on:
  # Staggered away from the other repositories' schedules.
  schedule:
    - cron: "46 * * * *"
  workflow_dispatch:
  issues:
    types: [edited]
  # A pull request with a merge conflict starts no pull_request run, so a
  # rebase tick on it needs this trigger. It also covers clean pull requests.
  pull_request_target:
    types: [edited]
  # Renovate runs when the checks of a Renovate branch have finished. The
  # list names every workflow that runs checks on a pull request: a
  # workflow left out can leave a pending check, and Renovate then waits
  # for the next scheduled tick.
  workflow_run:
    workflows: [checks, codeql, dco]
    types: [completed]
    branches: ["renovate/**"]

# The caller declares triggers only. The Renovate run gets its permissions from the token the
# reusable workflow mints for itself, not from this workflow's GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  renovate:
    uses: ostendorf-cloud/workflows/.github/workflows/reusable-renovate.yaml@v0
    # The one secret the reusable workflow declares. The app id is a variable and needs no
    # forwarding.
    secrets:
      GH_APP_DEPENDENCIES_PRIVATE_KEY: ${{ secrets.GH_APP_DEPENDENCIES_PRIVATE_KEY }}
