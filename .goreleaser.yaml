# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: gitcd

builds:
  - id: gitcd
    main: ./cmd/gitcd
    binary: gitcd
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - arm64
      - amd64
    ldflags:
      - -s -w -X main.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
