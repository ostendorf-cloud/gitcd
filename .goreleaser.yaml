# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: gitcd

builds:
  - id: gitcd
    main: ./cmd/gitcd
    binary: gitcd
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - arm64
      - amd64
    ldflags:
      - -s -w -X main.Version={{ .Version }} -X main.Commit={{ .FullCommit }} -X main.Date={{ .Date }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

# A formula, not a cask: see docs/adr/0003-homebrew-formula-not-cask.md.
# skip_upload is always on: goreleaser only renders the file into
# dist/homebrew/Formula/, with the URLs and checksums of this very build.
# release.yaml's own homebrew job pushes it to the tap with a token scoped
# to the tap, after the assets are public. goreleaser itself never holds a
# tap token.
brews:
  - name: gitcd
    directory: Formula
    homepage: https://github.com/ostendorf-cloud/gitcd
    description: Clone repositories into a predictable layout and apply a git identity profile per remote
    license: Apache-2.0
    skip_upload: true
    repository:
      owner: ostendorf-cloud
      name: homebrew-tap
      branch: main
    # The git identity features shell out to git, so the formula installs it.
    dependencies:
      - name: git
    test: |
      assert_match version.to_s, shell_output("#{bin}/gitcd version")

# No release section: release.yaml always runs this with --skip=publish,
# since goreleaser's own GitHub release handling cannot see the draft
# release release-me already created for the tag (GitHub's "get a release
# by tag" lookup excludes drafts). release.yaml attaches the archives and
# checksums built here with "gh release upload" and publishes with
# "gh release edit --draft=false" instead. See
# docs/adr/0001-draft-releases-until-assets-attach.md in release-me's own
# repository, the organisation's precedent for this shape.
