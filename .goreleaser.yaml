# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: gitcd

builds:
  - id: gitcd
    main: ./cmd/gitcd
    binary: gitcd
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - arm64
      - amd64
    ldflags:
      - -s -w -X main.Version={{ .Version }} -X main.Commit={{ .FullCommit }} -X main.Date={{ .Date }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

# release-me already created the GitHub release and its changelog entry by
# the time this runs; keep its notes instead of letting goreleaser write its
# own, and skip generating a second changelog it would never show.
release:
  mode: keep-existing

changelog:
  disable: true
