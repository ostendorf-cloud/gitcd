version: "3"

vars:
  BIN: bin/gitcd

tasks:
  setup:
    desc: Install the pinned toolchain
    cmds:
      - mise trust
      - mise install

  build:
    desc: Build the CLI into bin/
    cmds:
      - go build -o {{.BIN}} ./cmd/gitcd

  build:release:
    desc: Build a local snapshot release with goreleaser
    cmds:
      # No OIDC token outside a workflow run, so no signature.
      - goreleaser release --snapshot --clean --skip=sign

  run:
    desc: Run the CLI from source, arguments after --
    cmds:
      - go run ./cmd/gitcd {{.CLI_ARGS}}

  generate:gitkeys:
    desc: Regenerate the git config key list from the installed git
    cmds:
      - ./scripts/generate-git-config-keys.sh

  lint:fmt:
    desc: Go format check through golangci-lint
    cmds:
      - golangci-lint fmt --diff

  lint:vet:
    desc: Go vet
    cmds:
      - go vet ./...

  lint:golangci:
    desc: Go lint
    cmds:
      - golangci-lint run

  lint:license:
    desc: License header check for every Go and shell source file
    cmds:
      - |
        addlicense -check -c "Simon Ostendorf" -y 2026 -l apache -s=only \
          $(find . \( -name "*.go" -o -name "*.sh" \) \
            -not -path "./.git/*" -not -path "./.claude/*" -not -path "./bin/*" -not -path "./dist/*")

  lint:license-spdx:
    desc: Every covered source file names the license of LICENSE
    cmds:
      - scripts/check-license-spdx.sh

  lint:markdown:
    desc: Markdown lint
    cmds:
      - markdownlint-cli2 "**/*.md"

  lint:yaml:
    desc: YAML lint
    cmds:
      - yamllint .

  lint:actions:
    desc: GitHub Actions workflow lint
    cmds:
      - actionlint

  lint:goreleaser:
    desc: goreleaser configuration lint
    cmds:
      # goreleaser check exits 2 for a valid file that uses a deprecated
      # property, and 1 for an invalid one. The brews deprecation is a
      # decision (docs/adr/0003-homebrew-formula-not-cask.md), so exit 2 passes
      # only for exactly this output, see scripts/check-goreleaser-output.sh.
      # NO_COLOR is a second measure: that script strips colours itself.
      - |
        status=0
        out="$(NO_COLOR=1 goreleaser check 2>&1)" || status=$?
        echo "$out" | scripts/check-goreleaser-output.sh "$status"

  lint:shell:
    desc: Shell script lint for this repository's own CI scripts
    cmds:
      - shellcheck scripts/*.sh

  lint:secrets:
    desc: Secret scan over the git history
    cmds:
      - gitleaks git --no-banner --redact

  test:go:
    desc: Go tests with the race detector
    cmds:
      - go test -race -count=1 ./...

  test:pwsh:
    desc: Run the "gitcd shell-init pwsh" snippet under a real PowerShell process
    cmds:
      - go test -race -count=1 -run TestShellWrapper_ExecutesInPowerShell ./cmd/gitcd/...

  test:shell:
    desc: Shell script tests for this repository's own CI scripts
    cmds:
      - scripts/publish-release-assets_test.sh
      - scripts/check-goreleaser-output_test.sh
      - scripts/check-homebrew-formula_test.sh
      - scripts/publish-homebrew-formula_test.sh

  test:formula:
    desc: Render the Homebrew formula from a snapshot build and check it
    cmds:
      - goreleaser release --snapshot --clean --skip=announce,validate,publish,sign
      - |
        f=dist/homebrew/Formula/gitcd.rb
        test -s "$f"
        for p in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
          grep -qE "releases/download/[^/]+/gitcd_${p}\.tar\.gz" "$f" || { echo "formula has no URL for ${p}" >&2; exit 1; }
          sum="$(grep "gitcd_${p}.tar.gz" dist/gitcd_*_checksums.txt | cut -d' ' -f1)"
          grep -qF "sha256 \"${sum}\"" "$f" || { echo "formula checksum for ${p} differs from the checksums file" >&2; exit 1; }
        done
        grep -q "on_macos do" "$f" && grep -q "on_linux do" "$f"
        grep -qx '  depends_on "git"' "$f" || { echo "formula does not depend on git" >&2; exit 1; }
        # Every line must be part of the generated template the release
        # check expects, so a change to the brews entry updates both.
        tag="$(grep -m1 -oE 'releases/download/[^/]+' "$f" | cut -d/ -f3)"
        scripts/check-homebrew-formula.sh "$f" "$tag"

  check:
    desc: Every check, one after another
    cmds:
      - task: lint:fmt
      - task: lint:vet
      - task: lint:golangci
      - task: lint:license
      - task: lint:license-spdx
      - task: lint:markdown
      - task: lint:yaml
      - task: lint:actions
      - task: lint:goreleaser
      - task: lint:shell
      - task: lint:secrets
      - task: test:go
      - task: test:pwsh
      - task: test:shell
      - task: test:formula
      - task: build

  fmt:
    desc: Format Go code
    cmds:
      - golangci-lint fmt
