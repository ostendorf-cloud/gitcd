version: "3"

vars:
  BIN: bin/gitcd

tasks:
  setup:
    desc: Install the pinned toolchain
    cmds:
      - mise trust
      - mise install

  build:
    desc: Build the CLI into bin/
    cmds:
      - go build -o {{.BIN}} ./cmd/gitcd

  build:release:
    desc: Build a local snapshot release with goreleaser
    cmds:
      - goreleaser release --snapshot --clean

  run:
    desc: Run the CLI from source, arguments after --
    cmds:
      - go run ./cmd/gitcd {{.CLI_ARGS}}

  generate:gitkeys:
    desc: Regenerate the git config key list from the installed git
    cmds:
      - ./scripts/generate-git-config-keys.sh

  lint:fmt:
    desc: Go format check through golangci-lint
    cmds:
      - golangci-lint fmt --diff

  lint:vet:
    desc: Go vet
    cmds:
      - go vet ./...

  lint:golangci:
    desc: Go lint
    cmds:
      - golangci-lint run

  lint:markdown:
    desc: Markdown lint
    cmds:
      - markdownlint-cli2 "**/*.md"

  lint:yaml:
    desc: YAML lint
    cmds:
      - yamllint .

  lint:actions:
    desc: GitHub Actions workflow lint
    cmds:
      - actionlint

  lint:goreleaser:
    desc: goreleaser configuration lint
    cmds:
      - goreleaser check

  lint:shell:
    desc: Shell script lint for this repository's own CI scripts
    cmds:
      - shellcheck scripts/*.sh

  lint:secrets:
    desc: Secret scan over the git history
    cmds:
      - gitleaks git --no-banner --redact

  test:go:
    desc: Go tests with the race detector
    cmds:
      - go test -race -count=1 ./...

  test:pwsh:
    desc: Run the "gitcd shell-init pwsh" snippet under a real PowerShell process
    cmds:
      - go test -race -count=1 -run TestShellWrapper_ExecutesInPowerShell ./cmd/gitcd/...

  test:shell:
    desc: Shell script tests for this repository's own CI scripts
    cmds:
      - scripts/publish-release-assets_test.sh

  check:
    desc: Every check, one after another
    cmds:
      - task: lint:fmt
      - task: lint:vet
      - task: lint:golangci
      - task: lint:markdown
      - task: lint:yaml
      - task: lint:actions
      - task: lint:goreleaser
      - task: lint:shell
      - task: lint:secrets
      - task: test:go
      - task: test:pwsh
      - task: test:shell
      - task: build

  fmt:
    desc: Format Go code
    cmds:
      - golangci-lint fmt
