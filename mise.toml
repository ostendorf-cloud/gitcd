[tools]
go = "1.27.4"
task = "3"
# Pinned to the patch, not "2": a golangci-lint release is built against one Go patch and
# cannot read the stdlib export data of a newer one, so the two versions move together.
golangci-lint = "2.15.0"
actionlint = "1"
markdownlint-cli2 = "0.24.2"
yamllint = "1"
gitleaks = "8"
"aqua:google/addlicense" = "1.2.0"
# Pinned to the patch, not "2": the winget manifest carries the schema version GoReleaser
# writes (1.28.0 since 2.20.2, 1.12.0 before), and scripts/check-winget-manifest.sh compares
# it with a skeleton. A newer GoReleaser changes it, so a bump is a deliberate change with
# the skeleton updated.
goreleaser = "2.20.3"
# Signs the release checksums, see docs/adr/0004-keyless-signing.md. The 3.x line
# writes the bundle format by default.
cosign = "3.1"
shellcheck = "0"
# Used only to execute the "gitcd shell-init pwsh" snippet in its own
# test; not needed to build gitcd itself.
powershell = "7.7.0"
